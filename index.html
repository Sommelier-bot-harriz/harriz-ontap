<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cervecería Harriz — On Tap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
--cream:#f4ecda;
--cream-dim:#d8cdb4;
--amber:#e8a33d;
--card-bg:rgba(10,8,6,0.72);
--card-line:rgba(255,255,255,0.08);
--banner:#f1e35a;
--banner-ink:#2a1c05;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;}
body{
font-family:'Inter',sans-serif;
background:#15100c url('Assets/Ladrillos.png') center/cover no-repeat;
color:var(--cream);
width:100vw;height:100vh;
display:flex;flex-direction:column;
}

header{
display:flex;align-items:center;justify-content:center;
padding:1.6vh 0 1.2vh;
position:relative;
}
.banner{
background:var(--banner);
color:var(--banner-ink);
font-family:'Playfair Display',serif;
font-weight:700;
font-style:italic;
font-size:clamp(2rem,4vw,3.4rem);
padding:0.4em 1em;
transform:rotate(-0.6deg);
box-shadow:0 6px 0 rgba(0,0,0,0.15);
letter-spacing:0.01em;
}
.logo-harriz{
position:absolute;
right:3vw;top:50%;transform:translateY(-50%);
height:6vh;width:auto;
opacity:0.95;
}

.grid{
flex:1;
display:grid;
grid-template-columns:repeat(3,1fr);
grid-template-rows:repeat(4,1fr);
gap:1vh 1.6vw;
padding:0 3vw 1.6vh;
min-height:0;
}

.card{
background:var(--card-bg);
border:1px solid var(--card-line);
border-radius:10px;
padding:0.8vh 1.2vw;
display:flex;
flex-direction:column;
justify-content:center;
position:relative;
min-width:0;
min-height:0;
overflow:hidden;
}
.card.empty{
align-items:center;justify-content:center;
border-style:dashed;
background:rgba(10,8,6,0.35);
}
.empty-label{
font-family:'Inter',sans-serif;
font-weight:700;
letter-spacing:0.18em;
font-size:clamp(0.85rem,1vw,1.1rem);
color:var(--cream-dim);
}

.card-top{
display:flex;justify-content:space-between;align-items:flex-start;gap:0.6vw;
}
.beer-name{
font-family:'Inter',sans-serif;
font-weight:800;
font-size:clamp(1.1rem,1.7vw,1.7rem);
line-height:1.05;
margin:0;
text-transform:uppercase;
letter-spacing:0.01em;
}
.brand-logo{
height:clamp(38px,4.4vw,58px);
width:auto;
max-width:16vw;
object-fit:contain;
flex-shrink:0;
}
.brand-name{
font-family:'Inter',sans-serif;
font-weight:700;
font-size:clamp(0.8rem,1vw,1rem);
color:var(--amber);
text-transform:uppercase;
letter-spacing:0.05em;
margin:0.1vh 0 0.3vh;
}

.detail{
font-size:clamp(0.72rem,0.85vw,0.9rem);
color:var(--cream-dim);
margin:0.5vh 0 0.3vh;
}
.desc{
font-size:clamp(0.7rem,0.82vw,0.88rem);
color:var(--cream-dim);
line-height:1.3;
margin:0;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
}

.updated{
position:fixed;bottom:0.6vh;right:1vw;
font-size:0.65rem;color:rgba(244,236,218,0.35);
font-family:'Inter',sans-serif;
}
</style>
</head>
<body>

<header>
<div class="banner">Nuestras Cervezas</div>
<img class="logo-harriz" src="Assets/LogoHarriz.png" alt="Cervecería Harriz" onerror="this.style.display='none'">
</header>

<div class="grid" id="grid"></div>
<div class="updated" id="updated"></div>

<script>
/* ============ CONFIGURACIÓN ============ */
// 1. Publicá la hoja "Harriz-OnTap" como CSV: Archivo → Compartir → Publicar en la web → CSV
// 2. Pegá esa URL acá abajo:
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTlLXc0RGlYM69xgehMkYvkqHcPZk4wSJo-WmcS-msTvE9eL49ym2YQMLD_gVhfx0q-z225UJoeFhuE/pub?gid=1673061872&single=true&output=csv";

// Cada cuánto se vuelve a leer la hoja (milisegundos). 5 minutos por defecto.
const REFRESH_MS = 5 * 60 * 1000;

// Cantidad de bloques fijos en la pizarra (3 columnas x 4 filas)
const TOTAL_TAPS = 12;

// Carpeta donde están los logos de cada marca (mismo repo, junto a este archivo)
const LOGOS_FOLDER = "Assets/logos/";
/* ======================================== */

function normalizar(str){
return (str || "")
.toString()
.trim()
.toLowerCase()
.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
.replace(/[^a-z0-9]/g, "");
}

function esDisponible(valor){
const v = normalizar(valor);
return v === "si" || v === "yes" || v === "true" || v === "1";
}

function normalizarClaves(row){
const out = {};
for(const k in row){ out[normalizar(k)] = row[k]; }
return out;
}

async function cargarDatos(){
try{
const res = await fetch(CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now());
const text = await res.text();
const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
const filasNorm = parsed.data.map(normalizarClaves);
const filas = filasNorm.filter(row => esDisponible(row["disponible"]));
render(filas);
document.getElementById("updated").textContent =
"Actualizado " + new Date().toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'}) +
" — " + parsed.data.length + " filas le\u00eddas, " + filas.length + " disponibles";
}catch(e){
console.error("Error cargando la hoja:", e);
document.getElementById("updated").textContent = "Error al actualizar — reintentando...";
}
}

function campo(row, ...posibles){
for(const key of posibles){
if(row[key] !== undefined && row[key] !== "") return row[key];
}
return "";
}

function render(filas){
const grid = document.getElementById("grid");
grid.innerHTML = "";

for(let i = 0; i < TOTAL_TAPS; i++){
const row = filas[i];
const card = document.createElement("div");

if(!row){
card.className = "card empty";
card.innerHTML = `<div class="empty-label">TAP LIBRE</div>`;
grid.appendChild(card);
continue;
}

const nombre = campo(row, "nombredefantasia", "nombre");
const estilo = campo(row, "estilo");
const cerveceria = campo(row, "cerveceria");
const ibus = campo(row, "ibus", "ibu");
const alc = campo(row, "alc", "abv");
const desc = campo(row, "descripcion");

const logoFile = LOGOS_FOLDER + normalizar(cerveceria) + ".png";

card.className = "card";
card.innerHTML = `
<div class="card-top">
<div>
<h2 class="beer-name">${escapeHtml(nombre)}</h2>
<div class="brand-name">${escapeHtml(cerveceria)}</div>
</div>
<img class="brand-logo" src="${logoFile}" alt="${escapeHtml(cerveceria)}"
onerror="this.style.display='none'">
</div>
<p class="detail">${escapeHtml(estilo)}${ibus ? " · " + escapeHtml(ibus) + " IBU" : ""}${alc ? " · " + escapeHtml(alc) + "% Alc." : ""}</p>
${desc ? `<p class="desc">${escapeHtml(desc)}</p>` : ""}
`;
grid.appendChild(card);
}
}

function escapeHtml(str){
return (str || "").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

cargarDatos();
setInterval(cargarDatos, REFRESH_MS);

// Recarga completa cada 6 horas, por las dudas (limpia memoria acumulada en el TV)
setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
</script>
</body>
</html>
